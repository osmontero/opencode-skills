[project]
name = "opencode-skills"
version = "0.1.0"
description = "Python dependencies for opencode skills"
requires-python = ">=3.12"

dependencies = [
    # PDF skill
    "pdfplumber>=0.11.0",
    "pypdf>=6.0.0",
    "pypdfium2>=5.0.0",
    # canvas-art skill (PIL + numpy rendering)
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    # webapp-testing skill
    "playwright>=1.40.0",
    # mcp-builder skill
    "anthropic>=0.39.0",
    # ThreatWinds Vision MCP server
    "mcp>=1.1.0",
    "pydantic>=2.13.4",
    # creating-skills quick_validate/package_skill (frontmatter YAML)
    "pyyaml>=6.0",
]

[tool.setuptools.packages]
find = { include = [] }

[tool.uv]
